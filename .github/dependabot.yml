version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.EntityFrameworkCore"
          - "Microsoft.EntityFrameworkCore.*"
          - "xunit.runner.visualstudio"
    ignore:
      # EF Core packages are version-pinned per project to specific major versions
      # (e.g., [6.0.36,7.0.0) for EF6, [7.0.20,8.0.0) for EF7, etc.)
      # Dependabot does not understand NuGet version range syntax and will
      # break these pins by bumping to the latest major version.
      - dependency-name: "Microsoft.EntityFrameworkCore"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.InMemory"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.SqlServer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.Tools"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.Design"
        update-types: ["version-update:semver-major"]
      # Runner 3.x runs xunit 2.x tests fine, but it drops .NET Framework and net6.0/net7.0, and
      # this repo pins the runner to 2.8.2 on every slot (#581; the net4x/net6/net7 references
      # also carry allowedVersions="(,3.0.0)"). Dependabot cannot bump one TFM slot and not
      # another, so hold the whole line at 2.x until the net8.0+ slots move to 3.x.
      - dependency-name: "xunit.runner.visualstudio"
        versions: [">=3.0.0"]
      # Microsoft.NET.Test.Sdk 17.14.0 and every 18.x ship only net8.0 and net462 assets, so the
      # net6.0/net7.0 slots stay on 17.8.0 (#592; 17.13.0 is the last release with the
      # netcoreapp3.1 asset they use). Dependabot did bump that slot once (#64, 17.8.0 -> 18.0.1).
      # Block majors (the 17 -> 18 jump; 18.x -> 19 also needs a look first) and the 17.14+ minors;
      # the net8.0+ slots keep getting 18.x minor and patch updates.
      - dependency-name: "Microsoft.NET.Test.Sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.NET.Test.Sdk"
        versions: [">=17.14.0, <18.0.0"]

  # No "pip" entry for .github/requirements on purpose (#592): those lockfiles are generated by
  # `uv pip compile` (the exact command is in each file's header), and semgrep.txt is compiled
  # with --override semgrep-overrides.txt to lift PyJWT past semgrep's vulnerable ~=2.13 pin.
  # Dependabot's pip updater regenerates with pip-compile and drops that override, so these
  # files are refreshed by hand by re-running the recorded command.

  # Keep third-party GitHub Actions pinned in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
