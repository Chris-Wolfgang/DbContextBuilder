name: SAST (Semgrep)

# Security-grade static analysis beyond CodeQL (#164).
#
# Semgrep runs a different engine and ruleset from CodeQL (pattern/dataflow
# rules for C#, a general security-audit pack, and a secrets pack), so it
# surfaces issues CodeQL's queries don't. Findings upload to Code Scanning
# (Security tab) as an additional signal; report-only for now (`|| true`) so a
# noisy new ruleset can't block merges — promote to a gate once the baseline is
# clean.
#
# Uses the public Semgrep registry packs, which need no account/login.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Take the requirements file from the base branch
        # This job holds security-events: write and, under pull_request, checks out the PR's
        # own tree - including .github/requirements/semgrep.txt, which the next step
        # pip-installs and then EXECUTES. --require-hashes does not help: the hashes live in
        # the same PR-controlled file. protected-files.yaml fails such a PR, but it is a
        # required check rather than a sandbox: it runs independently and blocks the merge,
        # not the run. So the file is replaced with the base branch's copy first.
        env:
          # persist-credentials:false above leaves nothing in .git/config, so the fetch needs
          # the job token. Used on this one command; never written to config.
          TRUSTED_BASE_URL: https://github.com/${{ github.repository }}
          FETCH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          # The job token goes in a per-command http.extraheader, never in the URL, so it cannot
          # show up in git error output or a remote (#592), the same pattern as docfx.yaml.
          fetch_auth="http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
          set -euo pipefail
          if ! git -c "$fetch_auth" fetch --quiet --depth=1 "$TRUSTED_BASE_URL" "$BASE_REF:refs/remotes/origin/trusted-base"; then
            echo "::error::Could not fetch $BASE_REF - refusing to install PR-controlled requirements."
            exit 1
          fi
          if ! git checkout refs/remotes/origin/trusted-base -- .github/requirements/semgrep.txt; then
            echo "::error::.github/requirements/semgrep.txt is not on $BASE_REF - refusing to fall back to the PR copy."
            exit 1
          fi
          echo "Using $BASE_REF copy of .github/requirements/semgrep.txt"

      - name: Install Semgrep
        # Hash-pinned rather than a bare `pip install semgrep` (OSSF Scorecard
        # Pinned-Dependencies: "pipCommand not pinned by hash"). --require-hashes
        # makes pip verify every wheel it downloads and refuse anything not
        # listed, so the transitive tree is pinned too. Regenerate with the uv
        # command recorded in the header of the requirements file; the resolution
        # is universal, so it covers every runner platform and Python version.
        # --no-deps: the file already lists the complete tree, and the tree
        # deliberately overrides one of semgrep's own pins (see
        # semgrep-overrides.txt), which pip's resolver would otherwise re-apply.
        run: pip install --no-deps --require-hashes -r .github/requirements/semgrep.txt

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/csharp \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --error || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
