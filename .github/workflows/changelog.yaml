# Changelog fragment check, moved out of pr.yaml (#613) so a label change re-runs it.
#
# Every PR that touches src/ must add a fragment under changelog/unreleased/ or carry the
# `no-changelog` label. The check reads the PR's labels from the event payload, and a re-run
# replays the ORIGINAL payload, so inside pr.yaml adding the label never helped: only a new
# push did. pr.yaml cannot listen for labeled/unlabeled itself - every required job would run
# again on each label change, and skipping them on label events would report the required
# checks as skipped, which GitHub counts as passing. So this one job runs on its own, on the
# usual pull_request events plus labeled/unlabeled. The job name is unchanged, so it reports
# the same "Changelog Fragment Check" status.
#
# The script is taken from main so a PR cannot weaken its own check; the fragments and the
# diff come from the PR head. See changelog/unreleased/README.md.
name: Changelog

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog-check:
    name: "Changelog Fragment Check"
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]' || github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch trusted changelog script from main
        shell: bash
        env:
          # The checkout uses persist-credentials:false (nothing in .git/config for
          # PR-controlled build steps to read), so a bare `git fetch origin` has no
          # auth and fails on a private repository. Pass the job token on this one
          # command only; it is never written to git config.
          TRUSTED_MAIN_URL: https://github.com/${{ github.repository }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          # The job token goes in a per-command http.extraheader, never in the URL, so it cannot
          # show up in git error output or a remote (#592), the same pattern as docfx.yaml.
          fetch_auth="http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
          if ! git -c "$fetch_auth" fetch "$TRUSTED_MAIN_URL" main:refs/remotes/origin/main --depth=1; then
            echo "::error::Failed to fetch origin/main — aborting before changelog check."
            exit 1
          fi
          # Fail closed: never run the PR's own copy of the validator. This job runs from the
          # PR's own pr.yaml (pull_request), so a PR that adds the script must not get to run
          # it: until main carries scripts/changelog.ps1, the check below refuses to run.
          if ! git cat-file -e origin/main:scripts/changelog.ps1 2>/dev/null; then
            echo "::error::scripts/changelog.ps1 is not present in origin/main — refusing to run the PR-controlled copy. Merge the script to main first."
            exit 1
          fi
          if ! git checkout origin/main -- scripts/changelog.ps1; then
            echo "::error::Failed to checkout origin/main:scripts/changelog.ps1 — aborting to prevent silent fall-back to the PR version."
            exit 1
          fi

      - name: Check for a changelog fragment
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # The checkout uses persist-credentials:false (nothing in .git/config for
          # PR-controlled build steps to read), so a bare `git fetch origin` has no
          # auth and fails on a private repository. Pass the job token on this one
          # command only; it is never written to git config.
          TRUSTED_MAIN_URL: https://github.com/${{ github.repository }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          # The job token goes in a per-command http.extraheader, never in the URL, so it cannot
          # show up in git error output or a remote (#592), the same pattern as docfx.yaml.
          $fetchAuth = "http.extraheader=AUTHORIZATION: basic " + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:FETCH_TOKEN"))
          git -c $fetchAuth fetch "$env:TRUSTED_MAIN_URL" $env:BASE_SHA --depth=1
          pwsh ./scripts/changelog.ps1 check -BaseRef $env:BASE_SHA -Labels $env:PR_LABELS
