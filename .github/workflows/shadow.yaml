name: Shadow workload

# Replays a realistic, mixed-traffic workload (samples/...Samples.ShadowWorkload,
# #292) against the current commit's source AND the last-published NuGet
# package, and fails if latency or allocations regress beyond a threshold.
# Distinct from benchmarks.yaml (curated BDN micro-benchmarks graphed on every
# push to main): this runs full end-to-end scenarios (varying seed sizes, both
# providers, concurrent builders) rather than isolated method calls, and
# compares against a release baseline rather than trending over commits.
#
# "Baseline" means the published NuGet package (BaselineVersion, bumped via
# the same PR pattern that already bumps PackageValidationBaselineVersion
# after each release -- see the sample's csproj) rather than a git-tag
# checkout of old source. A tag checkout wouldn't have this sample the first
# time it's added, and package-vs-source keeps the comparison meaningful
# forever after: same harness code, only the library implementation differs.
#
# A percentage-only latency threshold over-flags shared-runner jitter, per
# the lesson recorded in AuditTrail's equivalent workflow (this one is ported
# from there) -- the absolute-ms floor below guards against that the same way
# pr-benchmarks.yaml's absolute floor does.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per scenario'
        required: false
        default: '200'
      latency-threshold-pct:
        description: 'Fail if mean latency regresses more than this percent'
        required: false
        default: '20'
      alloc-threshold-pct:
        description: 'Fail if mean allocated bytes regresses more than this percent'
        required: false
        default: '50'
      latency-abs-floor-ms:
        description: 'Also require the absolute mean-latency delta to clear this many ms before counting as regressed'
        required: false
        default: '20'
  schedule:
    - cron: '15 3 * * *'   # Nightly, 03:15 UTC

permissions:
  contents: read

concurrency:
  group: shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow:
    name: Run shadow workload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write   # required to file a tracking issue on failure
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Run against current source
        id: current
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '200' }}
        run: |
          set -euo pipefail
          dotnet run \
            --project samples/Wolfgang.DbContextBuilder.Samples.ShadowWorkload/Wolfgang.DbContextBuilder.Samples.ShadowWorkload.csproj \
            -c Release \
            -- ./current.json "$ITERATIONS"

      - name: Run against baseline package
        id: baseline
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '200' }}
        run: |
          set -euo pipefail
          dotnet run \
            --project samples/Wolfgang.DbContextBuilder.Samples.ShadowWorkload/Wolfgang.DbContextBuilder.Samples.ShadowWorkload.csproj \
            -c Release \
            -p:UseBaselinePackage=true \
            -- ./baseline.json "$ITERATIONS"

      - name: Compare against baseline
        id: compare
        env:
          LATENCY_THRESHOLD_PCT: ${{ github.event.inputs['latency-threshold-pct'] || '20' }}
          ALLOC_THRESHOLD_PCT: ${{ github.event.inputs['alloc-threshold-pct'] || '50' }}
          LATENCY_ABS_FLOOR_MS: ${{ github.event.inputs['latency-abs-floor-ms'] || '20' }}
        run: |
          set -euo pipefail

          regressions="$(jq -n \
            --argjson current "$(cat current.json)" \
            --argjson baseline "$(cat baseline.json)" \
            --argjson latencyThreshold "$LATENCY_THRESHOLD_PCT" \
            --argjson allocThreshold "$ALLOC_THRESHOLD_PCT" \
            --argjson latencyAbsFloorMs "$LATENCY_ABS_FLOOR_MS" \
            '
            [$current.Operations | keys[] as $op |
              $current.Operations[$op] as $c |
              $baseline.Operations[$op] as $b |
              ($c.MeanMs - $b.MeanMs) as $latencyDeltaMs |
              ($latencyDeltaMs / $b.MeanMs * 100) as $latencyPct |
              (if ($b.AllocatedBytesMean != null and $c.AllocatedBytesMean != null)
               then (($c.AllocatedBytesMean - $b.AllocatedBytesMean) / $b.AllocatedBytesMean * 100)
               else null end) as $allocPct |
              select((($latencyPct > $latencyThreshold) and ($latencyDeltaMs > $latencyAbsFloorMs)) or ($allocPct != null and $allocPct > $allocThreshold)) |
              {
                operation: $op,
                baselineMeanMs: $b.MeanMs, currentMeanMs: $c.MeanMs, latencyRegressionPct: ($latencyPct | round),
                baselineAllocBytes: $b.AllocatedBytesMean, currentAllocBytes: $c.AllocatedBytesMean, allocRegressionPct: ($allocPct | if . == null then null else round end)
              }
            ]
            ')"

          echo "$regressions" | jq .

          if [ "$(echo "$regressions" | jq 'length')" -gt 0 ]; then
            echo "::error::Shadow workload found regressions beyond threshold (latency >${LATENCY_THRESHOLD_PCT}% and >${LATENCY_ABS_FLOOR_MS}ms absolute, or allocations >${ALLOC_THRESHOLD_PCT}%)"
            echo "$regressions" > ./regressions.json
            exit 1
          fi

          echo "No regressions beyond threshold (latency >${LATENCY_THRESHOLD_PCT}% and >${LATENCY_ABS_FLOOR_MS}ms absolute, or allocations >${ALLOC_THRESHOLD_PCT}%)."

      - name: Upload shadow results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadow-results
          path: |
            ./current.json
            ./baseline.json
            ./regressions.json
          if-no-files-found: warn

      # A crash is not a regression. A workload that throws against the current source is a
      # bug in the library (#530 was filed as a "regression" when SeedWithRandom100 threw), so
      # it gets its own title and label: an open issue of one kind must not hide the other.
      - name: File a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CURRENT_OUTCOME: ${{ steps.current.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          set -euo pipefail
          if [ "$COMPARE_OUTCOME" = "failure" ]; then
            label=shadow-regression
            label_description="A scheduled shadow-workload run found a performance/allocation regression"
            title="Shadow workload found a performance/allocation regression"
            body="The scheduled shadow-workload run found the current commit regressing beyond threshold vs. the last-published release baseline.

          Download the \`shadow-results\` artifact from the run for the full current/baseline reports and the specific regressions found."
          elif [ "$CURRENT_OUTCOME" = "failure" ]; then
            label=shadow-failure
            label_description="A scheduled shadow-workload run could not complete"
            title="Shadow workload crashed against the current source"
            body="The scheduled shadow-workload run failed in **Run against current source**: a scenario threw (or the sample failed to build) against the current commit, so there is no report to compare. This is a bug, not a performance regression. The run log names the scenario and the exception."
          elif [ "$BASELINE_OUTCOME" = "failure" ]; then
            label=shadow-failure
            label_description="A scheduled shadow-workload run could not complete"
            title="Shadow workload could not run the baseline package"
            body="The scheduled shadow-workload run failed in **Run against baseline package** (the last-published release, restored from NuGet), so there is nothing to compare against. The current-source run completed; its report is in the \`shadow-results\` artifact."
          else
            label=shadow-failure
            label_description="A scheduled shadow-workload run could not complete"
            title="Shadow workload failed before it could run"
            body="The scheduled shadow-workload run failed before running the workload (checkout or .NET setup). See the run log."
          fi

          gh label create "$label" --color B60205 --description "$label_description" 2>/dev/null || true

          open_count="$(gh issue list --label "$label" --state open --json number --jq 'length')"
          if [ "${open_count:-0}" -gt 0 ]; then
            echo "An open $label issue already exists — not filing another."
            exit 0
          fi

          gh issue create --title "$title" --label "$label" --body "$body

          Run: ${RUN_URL}"
