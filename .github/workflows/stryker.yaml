# Stryker mutation testing
#
# Mutation testing is canonical for every repo created from this template.
# The workflow runs Stryker.NET against every test project under tests/ on
# a Windows runner so it can compile every TFM the repo targets - including
# .NET Framework 4.6.2-4.8.1, which a Linux runner cannot build.
#
# Triggers:
# - workflow_dispatch: manual ad-hoc runs (e.g. while iterating on tests)
# - schedule (weekly Sunday 06:00 UTC): catch quality regressions between
#   releases without burning CI time on every PR (mutation testing is slow)
#
# Stryker discovers each test project's mutation targets via the standard
# project-reference graph. Two configuration modes are supported:
# - Root stryker-config.json (umbrella): if present, runs Stryker once with
#   the umbrella config and skips per-project runs (avoids duplicate work).
#   A test project with its own stryker-config.json is then also run on its own,
#   in project mode, for a package the umbrella's solution mode cannot measure
#   (#552); the umbrella config's mutate list leaves that package out.
# - Per-project stryker-config.json (or none): if no root config exists, runs
#   Stryker once per test project; per-project configs override Stryker's
#   defaults when present.
#
# After every run (#300) the `publish` job charts the mutation score on gh-pages
# under /dev/stryker (the same action as the /dev/bench benchmark charts) and keeps
# ONE rolling `kind:mutation-survives` issue listing the surviving and uncovered
# mutants (closed when a run leaves none). It is a separate ubuntu job so the long Stryker job, which builds and
# runs the repository's code, never holds a write token.
name: Stryker (mutation testing)

# Pull requests (#300): a full run takes about 55 minutes, so a PR runs Stryker with
# --since:<base commit>. Only mutants in files the PR changed, plus mutants covered by
# tests the PR changed, are tested, and stryker-config.json's break floor applies to
# them. The config is taken from the base branch, so a PR cannot lower its own floor.
# A changed test file brings in every mutant its tests cover, so a PR that edits a widely
# used test file still runs much of the suite. Docs, workflow and changelog changes are kept
# out of the diff by since.ignore-changes-in in stryker-config.json; any other non-.cs change
# (a csproj, a props file) makes Stryker test every mutant.
# A PR whose changes leave nothing in scope passes with a notice. Score history and
# the survivors issue come from the weekly full run only.
# NEVER make this a required status check: a path-filtered workflow that does not run
# leaves a required check "Expected" forever.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**/*.cs'
      - 'tests/**/*.csproj'
      - 'stryker-config.json'
      - 'tests/**/stryker-config.json'
      - 'mutation-floors.json'
      - '.github/workflows/stryker.yaml'
  workflow_dispatch:
    inputs:
      verbosity:
        # For diagnosing a run (#701): anything above info adds --log-to-file, and the log lands
        # in StrykerOutput/*/logs, which the "Upload Stryker report" step already uploads.
        description: 'Stryker log verbosity; debug or trace also writes a log file into the uploaded report'
        type: choice
        options:
          - info
          - debug
          - trace
        default: info
  schedule:
    - cron: '0 6 * * 0' # weekly Sunday 06:00 UTC

permissions:
  contents: read

concurrency:
  group: stryker-${{ github.ref }}
  # Only PR runs are superseded by a newer push. Scheduled and dispatched runs publish a
  # score data point and update the survivors issue, so they run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stryker:
    name: Run Stryker
    # Windows runner so Stryker can compile every TFM the repo targets,
    # including .NET Framework 4.6.2-4.8.1. Linux runners cannot build
    # net4x, so they would silently mutate only the non-Framework TFMs
    # and miss bugs that only reproduce on Framework.
    runs-on: windows-latest
    # Skip on the template repo itself - it has no test projects, so the
    # workflow would just no-op every Sunday at 06:00 UTC, wasting a
    # Windows runner allocation. Matches the same-pattern guard used by
    # the .NET test-stage jobs in pr.yaml.
    #
    # Dependabot's bumps touch src/*.csproj, and a non-.cs change makes --since test every
    # mutant: about 55 minutes of Windows runner per bump. The weekly full run covers what a
    # dependency change does to the score. Only Dependabot's own pushes skip: a person who
    # pushes to a Dependabot branch still gets a run (#592).
    if: >-
      github.repository != 'Chris-Wolfgang/repo-template'
      && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
          || github.actor != 'dependabot[bot]')
    # A full run took 54 min on 2026-09-30, 76 min on 2026-10-04 and passed 120 min (cancelled)
    # on 2026-10-05, as tests were added. About a third of detected mutants are timeouts, each of
    # which waits out Stryker's per-mutant timeout, so the run grows with the suite. 240 leaves
    # room under GitHub's 360-minute job limit; raising Stryker's concurrency instead would put
    # more load on the runner and turn more mutants into load-sensitive timeouts.
    # A pull-request run is usually narrower, but not always: as the --since notes above say, a
    # changed test file brings in every mutant its tests cover, and a non-.cs change in scope
    # makes the run test every mutant, so a PR run can be as long as a full run. The 40
    # successful runs before 2026-10-11 (those cases included) took 46-126 min (median 79, p90
    # 112). Stryker's sleep detection can rerun a slow test session indefinitely (#702), so a PR
    # run stops at 165 min and frees the runner for a re-run. The weekly run and a manually
    # dispatched full run keep 240; if PR runs that test every mutant start nearing 165, raise
    # the PR limit rather than assume PR runs stay narrow.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 165 || 240 }}
    env:
      # vstest's default 90 s handshake was too short on a slow runner (#702: "failed to connect to
      # vstest.console process after 90 seconds ... set VSTEST_CONNECTION_TIMEOUT"). Seconds.
      VSTEST_CONNECTION_TIMEOUT: '300'
    outputs:
      score: ${{ steps.score.outputs.score }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # --since diffs against the base commit, so a PR needs the history.
          # Strings, not numbers: 0 is falsy in an expression, so `&& 0 || 1` always yields 1.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Floors only ratchet up
        # docs/MUTATION-TESTING.md: floors ratchet up, never down. The next step swaps in the base
        # copies of the floor files, so without this check a PR that lowers or removes a floor
        # would pass, and the lower floor would take effect on the next scheduled run unchecked.
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          function Get-BaseJson([string]$Path) {
            $text = git show "$($env:BASE_SHA):$Path" 2>$null
            if ($LASTEXITCODE -ne 0) { return $null }
            return ($text | Out-String | ConvertFrom-Json)
          }
          $failures = @()

          $baseBreak = (Get-BaseJson 'stryker-config.json').'stryker-config'.thresholds.break
          if ($null -ne $baseBreak) {
            $prBreak = if (Test-Path 'stryker-config.json') { (Get-Content 'stryker-config.json' -Raw | ConvertFrom-Json).'stryker-config'.thresholds.break } else { $null }
            if ($null -eq $prBreak) { $failures += "stryker-config.json: the repository floor (thresholds.break, $baseBreak %) was removed" }
            elseif ([double]$prBreak -lt [double]$baseBreak) { $failures += "stryker-config.json: the repository floor (thresholds.break) drops from $baseBreak % to $prBreak %" }
          }

          $baseFloors = (Get-BaseJson 'mutation-floors.json').floors
          if ($null -ne $baseFloors) {
            $prFloors = if (Test-Path 'mutation-floors.json') { (Get-Content 'mutation-floors.json' -Raw | ConvertFrom-Json).floors } else { $null }
            foreach ($floor in $baseFloors.PSObject.Properties) {
              $now = if ($null -ne $prFloors) { $prFloors.($floor.Name) } else { $null }
              if ($null -eq $now) { $failures += "mutation-floors.json: the floor for $($floor.Name) ($($floor.Value) %) was removed" }
              elseif ([double]$now -lt [double]$floor.Value) { $failures += "mutation-floors.json: the floor for $($floor.Name) drops from $($floor.Value) % to $now %" }
            }
          }

          foreach ($failure in $failures) { Write-Host "::error::$failure. Floors only ratchet up (docs/MUTATION-TESTING.md)." }
          if ($failures.Count -gt 0) { exit 1 }
          Write-Host 'No floor is lowered or removed.'
          # git show above leaves a non-zero $LASTEXITCODE when a base file is missing, and the
          # Actions pwsh wrapper would exit with it.
          exit 0

      - name: Use the base branch's floors (stryker-config.json files, mutation-floors.json)
        # The repository floor (break) and the per-project floors live in these files, and the
        # per-package configs under tests/ (#552) decide what those packages' runs mutate.
        # Running the PR's copies would let a PR lower the floors it is judged by.
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          files=(stryker-config.json mutation-floors.json)
          while IFS= read -r file; do files+=("$file"); done < <(
            git ls-tree -r --name-only "$BASE_SHA" -- tests | grep -E '/stryker-config[.]json$' || true)
          for file in "${files[@]}"; do
            if git cat-file -e "$BASE_SHA:$file" 2>/dev/null; then
              git checkout "$BASE_SHA" -- "$file"
              echo "Using $file from the base commit $BASE_SHA."
            else
              echo "::notice::No $file on the base commit - running with the PR's copy."
            fi
          done

      - name: Setup .NET
        # Install every SDK the repository's projects target (.NET 6.0
        # through .NET 10.0). Stryker has to be able to build whichever
        # TFM each test project targets; pinning to a subset would
        # silently fail repos that target older runtimes. No project
        # targets netcoreapp3.1 or net5.0, so those SDKs are not installed (#586).
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      # Pinned, not floating (#517).
      - name: Install dotnet-stryker
        shell: pwsh
        env:
          STRYKER_VERSION: '5.0.0'
        run: |
          dotnet tool update -g dotnet-stryker --version $env:STRYKER_VERSION
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install -g dotnet-stryker --version $env:STRYKER_VERSION
          }

      - name: Run Stryker
        shell: pwsh
        env:
          SINCE_SHA: ${{ github.event.pull_request.base.sha }}
          # Empty on pull_request and schedule runs, which keep the default logging.
          STRYKER_VERBOSITY: ${{ inputs.verbosity }}
        run: |
          # Configuration mode resolution:
          #   1. If a root stryker-config.json exists, it is the umbrella -
          #      run Stryker once with it and stop (per-project runs would
          #      duplicate the same work the umbrella already covers).
          #   2. Otherwise, run Stryker against every test project under
          #      tests/. A per-project stryker-config.json next to a test
          #      project overrides Stryker's defaults when present.

          #
          # A zero exit code is not proof that Stryker measured anything. With a
          # break threshold of 0 it exits 0 even after "Compilation failed" aborts
          # the run before a single mutant is tested: score 0.00 %, no report, and
          # a green job. So every run must also leave a JSON report holding at
          # least one tested mutant, or it counts as failed. The reporters are
          # passed on the command line (they override the config's list) so the
          # JSON report exists in both modes.

          $failed = 0
          $reporters = @('--reporter', 'progress', '--reporter', 'html', '--reporter', 'json')
          # On a pull request, test only what the PR changed (see the header). An empty
          # scope is then a legitimate outcome, not a run that silently measured nothing.
          # A dispatched diagnostic run (#701): more logging, and a log file in StrykerOutput.
          $logArgs = @()
          if ($env:STRYKER_VERBOSITY -and $env:STRYKER_VERBOSITY -ne 'info') {
            $logArgs = @('--verbosity', $env:STRYKER_VERBOSITY, '--log-to-file')
            Write-Host "Diagnostic run: Stryker verbosity $($env:STRYKER_VERBOSITY), logging to a file."
          }
          $sinceArgs = @()
          if ($env:SINCE_SHA) {
            $sinceArgs = @("--since:$($env:SINCE_SHA)")
            Write-Host "Pull request: mutating only changes since $($env:SINCE_SHA)."
          }

          # $Root is what report paths are made relative to when grouping by src/<project>: the
          # repository root, also for a project-mode run whose $Dir is a test project.
          function Test-StrykerRun([string]$Dir, [datetime]$Since, [string]$FloorsFile, [string]$Root = $Dir) {
            $reports = @(Get-ChildItem -Path (Join-Path $Dir 'StrykerOutput') -Recurse -Filter 'mutation-report.json' -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -ge $Since })
            if ($reports.Count -eq 0) {
              Write-Host "::error::Stryker in $Dir wrote no mutation-report.json - it stopped before testing any mutant."
              return $false
            }
            $counts = @{}
            $outOfScope = 0
            $perProject = @{}
            foreach ($report in $reports) {
              $json = Get-Content $report.FullName -Raw | ConvertFrom-Json
              foreach ($file in $json.files.PSObject.Properties) {
                # src/<project>/...: keys are absolute and can climb through a linked project.
                $rel = [IO.Path]::GetRelativePath($Root, [IO.Path]::GetFullPath($file.Name)) -replace '\\', '/'
                $parts = $rel -split '/'
                $project = if ($parts.Count -ge 3 -and $parts[0] -eq 'src') { "src/$($parts[1])" } else { $null }
                if ($project -and -not $perProject.ContainsKey($project)) { $perProject[$project] = @{} }
                foreach ($mutant in $file.Value.mutants) {
                  $counts[$mutant.status] = 1 + [int]$counts[$mutant.status]
                  if ($project) { $perProject[$project][$mutant.status] = 1 + [int]$perProject[$project][$mutant.status] }
                  # The reason Stryker 5 writes to the report for a mutant its since filter set aside
                  # (observed in a real --since run; the filter's internal message is overwritten).
                  if ($mutant.status -eq 'Ignored' -and $mutant.statusReason -eq 'Removed by since filter') { $outOfScope++ }
                }
              }
            }
            Write-Host "Mutant statuses in ${Dir}: $(($counts.GetEnumerator() | Sort-Object Name | ForEach-Object { "$($_.Name)=$($_.Value)" }) -join ', ')"
            # Stryker's score: detected (Killed + Timeout) over valid (detected + Survived + NoCoverage).
            $detected = [int]$counts['Killed'] + [int]$counts['Timeout']
            $valid = $detected + [int]$counts['Survived'] + [int]$counts['NoCoverage']
            if ($valid -eq 0) {
              # A pull request whose changes bring no mutant into scope is fine, but only when the
              # since filter is why nothing was tested. A report of nothing but compile errors, or
              # a scheduled run that tested nothing, still fails.
              if ($env:SINCE_SHA -and $outOfScope -gt 0) {
                Write-Host "::notice::Stryker in $Dir found no mutant in this pull request's changes ($outOfScope set aside by --since) - nothing to gate."
                return $true
              }
              Write-Host "::error::Stryker in $Dir tested no mutants - there is no score to judge."
              return $false
            }
            Write-Host ("Mutation score in {0}: {1:N2} % ({2} of {3} detected)" -f $Dir, (100.0 * $detected / $valid), $detected, $valid)

            # Per-project floors (#300): a repository-wide score can clear `break` while one package
            # sits far under it (2026-10-04: 90.65 % overall, src/Wolfgang.DbContextBuilder-EF6 at
            # 69 %). Every src project with a tested mutant is judged against its own floor; one with
            # no floor fails, so a new package cannot slip in ungated.
            if (-not $FloorsFile) { return $true }
            if (-not (Test-Path $FloorsFile)) {
              Write-Host "::error::$FloorsFile is missing - per-project mutation floors cannot be enforced."
              return $false
            }
            $floors = (Get-Content $FloorsFile -Raw | ConvertFrom-Json).floors
            $belowFloor = 0
            foreach ($project in ($perProject.Keys | Sort-Object)) {
              $c = $perProject[$project]
              $pDetected = [int]$c['Killed'] + [int]$c['Timeout']
              $pValid = $pDetected + [int]$c['Survived'] + [int]$c['NoCoverage']
              if ($pValid -eq 0) { continue }   # nothing of this project in scope (a PR run)
              $pScore = 100.0 * $pDetected / $pValid
              $floor = $floors.PSObject.Properties[$project].Value
              if ($null -eq $floor) {
                Write-Host ("::error::{0} scored {1:N2} % but has no floor in {2}. Add one a few points under its score." -f $project, $pScore, $FloorsFile)
                $belowFloor++
              }
              elseif ($pScore -lt [double]$floor) {
                Write-Host ("::error::{0}: {1:N2} % ({2} of {3} detected) is below its floor of {4} %." -f $project, $pScore, $pDetected, $pValid, $floor)
                $belowFloor++
              }
              else {
                Write-Host ("{0}: {1:N2} % ({2} of {3} detected), floor {4} %" -f $project, $pScore, $pDetected, $pValid, $floor)
              }
            }
            return ($belowFloor -eq 0)
          }

          if (Test-Path 'stryker-config.json') {
            Write-Host "::group::Stryker with root umbrella stryker-config.json"
            # Restore first. Stryker analyses every project BEFORE its own restore,
            # and on a fresh checkout a .NET Framework project analysed unrestored
            # comes back without its package references, so its mutated compile
            # fails ("System.Data.Entity does not exist") and the run aborts.
            $solution = (Get-Content 'stryker-config.json' -Raw | ConvertFrom-Json).'stryker-config'.solution
            if ($solution) { dotnet restore $solution } else { dotnet restore }
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::dotnet restore failed"; exit 1 }
            # A test project with its own stryker-config.json is measured in its own run below, and
            # its package is outside the umbrella's mutate list, so in this run its tests cover no
            # mutant. Stryker cannot filter test projects in solution mode, and per-test coverage
            # capture still ran each of their tests (39 % of the capture sessions, #701). So the
            # umbrella runs on a copy of the solution without those test projects. The copy sits next to the
            # original so its relative project paths resolve; `dotnet sln remove` exits 0 even when
            # it removes nothing, so the project count is checked.
            #
            # The same copy also leaves out projects the trace run (38178220920, #701) showed add
            # cost and nothing else:
            #   - extra-projects/* (the scaffolded AdventureWorks models): Stryker treated all five
            #     as projects to mutate, created ~13,580 mutants in them and discarded every one
            #     (excluded-from-coverage code), after an initial test run of ~370 tests each;
            #   - Tests.DocExamples, Tests.Fuzz and Tests.Concurrency: every one of their tests
            #     reported "No mutant covered" in coverage capture (32, 19 and 5 of 5), so with
            #     coverage-based selection they never test a mutant. DocExamples only compiles
            #     the documentation snippets. They stay in pr.yaml's test stages.
            # Projects referenced by a remaining test project still build; they are just not
            # analysed as solution projects.
            $solutionArgs = @()
            $ownRun = @(Get-ChildItem -Path tests -Recurse -Filter 'stryker-config.json' -ErrorAction SilentlyContinue |
              ForEach-Object { Get-ChildItem -Path $_.DirectoryName -Filter '*.csproj' })
            $noKills = @(
              @(Get-ChildItem -Path extra-projects -Recurse -Filter '*.csproj' -ErrorAction SilentlyContinue) +
              @(foreach ($name in 'DocExamples', 'Fuzz', 'Concurrency') {
                  Get-ChildItem -Path "tests/Wolfgang.DbContextBuilder.Tests.$name" -Filter '*.csproj' -ErrorAction SilentlyContinue
                }))
            # The five -Core-EF{N} wrappers compile the same linked source, so the umbrella created
            # and tested the same 407 mutants five times, once per wrapper and its test project.
            # EF6 (oldest) and EF10 (newest) are kept; between them they cover the EF_CORE_N
            # conditional code at both ends. EF7-EF9 and their test projects are dropped here and
            # stay in pr.yaml's test stages. Floors are keyed by source path
            # (src/Wolfgang.DbContextBuilder-Core), which EF6 and EF10 still report under.
            # Core-EF6 had two test projects: tests/...-Core-EF6.Tests.Unit has no code of its own
            # and links the same 12 files from tests/...-Core.Tests.Unit, with the same constants,
            # target frameworks and project references. In the umbrella every Core-EF6 test ran
            # twice, in coverage capture and against every mutant it covers, killing nothing the
            # other copy did not. The linking copy is dropped; the source project stays.
            $duplicateWrappers = @(
              @(foreach ($n in 7, 8, 9) {
                  Get-ChildItem -Path "src/Wolfgang.DbContextBuilder-Core-EF$n" -Filter '*.csproj' -ErrorAction SilentlyContinue
                  Get-ChildItem -Path "tests/Wolfgang.DbContextBuilder-Core.Tests.Unit-EF$n" -Filter '*.csproj' -ErrorAction SilentlyContinue
                }) +
              @(Get-ChildItem -Path 'tests/Wolfgang.DbContextBuilder-Core-EF6.Tests.Unit' -Filter '*.csproj' -ErrorAction SilentlyContinue))
            # Wolfgang.DbContextBuilder.Abstractions is one interface with no executable code, so
            # Stryker creates 0 mutants in it. It still runs per-test coverage capture for every
            # project it mutates (StrykerRunner has no zero-mutant check), here every Core test a
            # second time, and CoverageAnalyser logs "It looks like the test coverage capture
            # failed" whenever a project's capture covers no mutant: the one ERR every run logged
            # (#701). The guard below fails the run if Abstractions gains a class, struct or
            # record, so code added there is not silently left unmeasured.
            $noMutants = @(Get-ChildItem -Path 'src/Wolfgang.DbContextBuilder.Abstractions' -Filter '*.csproj' -ErrorAction SilentlyContinue)
            $abstractionsCode = @(Get-ChildItem -Path 'src/Wolfgang.DbContextBuilder.Abstractions' -Recurse -Filter '*.cs' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } |
              Select-String -Pattern '^(?!\s*//).*\b(class|struct|record)\s+\w')
            if ($abstractionsCode.Count -gt 0) {
              Write-Host "::error::src/Wolfgang.DbContextBuilder.Abstractions now declares a type with code ($($abstractionsCode[0].Filename):$($abstractionsCode[0].LineNumber)); remove it from the umbrella's drop list so it is mutated."
              exit 1
            }
            $drop = @($ownRun + $noKills + $duplicateWrappers + $noMutants)
            if ($solution -and $drop.Count -gt 0) {
              $umbrella = Join-Path (Split-Path -Parent (Resolve-Path $solution)) ('stryker-umbrella' + [IO.Path]::GetExtension($solution))
              Copy-Item $solution $umbrella -Force
              $before = @(Select-String -Path $umbrella -Pattern '<Project ').Count
              dotnet sln $umbrella remove @($drop.FullName)
              $after = @(Select-String -Path $umbrella -Pattern '<Project ').Count
              if ($LASTEXITCODE -ne 0 -or ($before - $after) -ne $drop.Count) {
                Write-Host "::error::Could not remove the $($drop.Count) project(s) from $umbrella ($before -> $after projects)."
                exit 1
              }
              Write-Host "Umbrella solution: $umbrella, without $($drop.Name -join ', ')."
              $solutionArgs = @('--solution', $umbrella)
            }
            $started = Get-Date
            dotnet stryker --config-file stryker-config.json @reporters @sinceArgs @logArgs @solutionArgs
            if ($LASTEXITCODE -ne 0) { $failed++ }
            elseif (-not (Test-StrykerRun -Dir (Get-Location).Path -Since $started -FloorsFile 'mutation-floors.json')) { $failed++ }
            Write-Host "::endgroup::"

            # A test project with its own stryker-config.json is measured on its own, in project
            # mode (#552). Solution mode cannot measure a package whose test project targets
            # several frameworks with a different reference per framework: it runs every
            # framework's build of the tests but injects the mutant into one, so the kills are
            # lost (coverage capture fails and they survive, or every mutant times out). The
            # umbrella config's mutate list leaves those packages out.
            $root = (Get-Location).Path
            foreach ($config in @(Get-ChildItem -Path tests -Recurse -Filter 'stryker-config.json' -ErrorAction SilentlyContinue)) {
              $dir = $config.DirectoryName
              Write-Host "::group::Stryker in $dir (project mode)"
              Push-Location $dir
              try {
                $started = Get-Date
                dotnet stryker --config-file stryker-config.json @reporters @sinceArgs @logArgs
                if ($LASTEXITCODE -ne 0) { $failed++ }
                elseif (-not (Test-StrykerRun -Dir $dir -Since $started -FloorsFile (Join-Path $root 'mutation-floors.json') -Root $root)) { $failed++ }
              } finally {
                Pop-Location
              }
              Write-Host "::endgroup::"
            }
          }
          else {
            $tests = @(Get-ChildItem -Path tests -Recurse -Filter '*Test*.csproj' -ErrorAction SilentlyContinue)

            if ($tests.Count -eq 0) {
              Write-Host "::notice::No test projects found under tests/ - skipping Stryker run."
              exit 0
            }

            Write-Host "Found $($tests.Count) test project(s):"
            $tests | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host ""

            foreach ($proj in $tests) {
              $dir = $proj.DirectoryName
              Write-Host "::group::Stryker in $dir"
              Push-Location $dir
              try {
                # Restore before Stryker analyses the project; see the umbrella branch.
                dotnet restore
                if ($LASTEXITCODE -ne 0) { $failed++ }
                else {
                  $started = Get-Date
                  dotnet stryker @reporters @sinceArgs @logArgs
                  if ($LASTEXITCODE -ne 0) { $failed++ }
                  elseif (-not (Test-StrykerRun -Dir $dir -Since $started)) { $failed++ }
                }
              } finally {
                Pop-Location
              }
              Write-Host "::endgroup::"
            }
          }

          if ($failed -gt 0) {
            Write-Host "::error::$failed Stryker run(s) failed"
            exit 1
          }

      - name: Summarize mutation score and survivors
        id: score
        # always(): a run that fell below the break floor is exactly when the trend and
        # the survivor list matter most. Reads the same JSON reports Test-StrykerRun checks.
        if: always()
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path . -Recurse -Filter 'mutation-report.json' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]StrykerOutput[\\/]' })
          if ($reports.Count -eq 0) {
            Write-Host "::warning::No mutation-report.json - there is no score to publish."
            exit 0
          }

          $counts = @{}
          $gaps = [System.Collections.Generic.List[object]]::new()
          foreach ($report in $reports) {
            $json = Get-Content $report.FullName -Raw | ConvertFrom-Json
            foreach ($file in $json.files.PSObject.Properties) {
              # Keys are absolute and can climb through a linked project
              # (src\X-EF10\..\X\File.cs); report them relative to the repository.
              $path = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, [IO.Path]::GetFullPath($file.Name)) -replace '\\', '/'
              foreach ($mutant in $file.Value.mutants) {
                $counts[$mutant.status] = 1 + [int]$counts[$mutant.status]
                if ($mutant.status -in 'Survived', 'NoCoverage') {
                  $start = $mutant.location.start
                  $end = $mutant.location.end
                  $gaps.Add([pscustomobject]@{
                    Path = $path; Line = [int]$start.line; Column = [int]$start.column
                    EndLine = [int]$end.line; EndColumn = [int]$end.column
                    Status = $mutant.status; Mutator = $mutant.mutatorName; Replacement = [string]$mutant.replacement
                  })
                }
              }
            }
          }

          # Stryker's score: detected (Killed + Timeout) over valid (detected + Survived + NoCoverage).
          $detected = [int]$counts['Killed'] + [int]$counts['Timeout']
          $valid = $detected + [int]$counts['Survived'] + [int]$counts['NoCoverage']
          if ($valid -eq 0) {
            Write-Host "::warning::The reports hold no tested mutant - there is no score to publish."
            exit 0
          }
          $score = [math]::Round(100.0 * $detected / $valid, 2)

          # A source file linked into several projects (-Core into -Core-EF6..EF10) is
          # mutated once per project, and those copies agree on path, span and replacement.
          # Key on all of them so the copies collapse but two different mutations on one
          # line (another column, or the same mutator with another replacement) both stay.
          $lines = @($gaps |
            Sort-Object Path, Line, Column, EndLine, EndColumn, Status, Mutator, Replacement -Unique |
            ForEach-Object { "- ``$($_.Path):$($_.Line):$($_.Column)`` - $($_.Status): $($_.Mutator)" })
          $config = Get-Content 'stryker-config.json' -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          $break = if ($config) { $config.'stryker-config'.thresholds.break } else { $null }
          $floor = if ($null -ne $break) { "$break %" } else { 'none' }

          New-Item -ItemType Directory -Force -Path stryker-summary | Out-Null
          ConvertTo-Json -InputObject @(@{ name = 'Mutation score'; unit = '%'; value = $score }) |
            Set-Content stryker-summary/mutation-score.json
          $header = @(
            ("Mutation score **{0} %** (break floor: {1}) over {2} valid mutants: {3} killed, {4} timed out, {5} survived, {6} not covered." -f
              $score, $floor, $valid, [int]$counts['Killed'], [int]$counts['Timeout'], [int]$counts['Survived'], [int]$counts['NoCoverage'])
            ''
            "$($lines.Count) surviving or uncovered mutants (each distinct mutant once). Kill these to raise the score:"
            ''
          )
          $header + $lines | Set-Content stryker-summary/survivors.md

          Get-Content stryker-summary/survivors.md | Add-Content $env:GITHUB_STEP_SUMMARY
          "score=$score" | Add-Content $env:GITHUB_OUTPUT

      - name: Upload score and survivor summary
        if: always() && steps.score.outputs.score != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-summary
          path: stryker-summary/
          retention-days: 30

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-report-${{ github.run_id }}
          path: |
            **/StrykerOutput/**
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Publish score history and survivors
    needs: stryker
    # Runs after a failed gate too: the score and the survivors are the point then.
    # Not on pull requests: their --since score covers only the PR's changes.
    # Only from main: a run dispatched on another branch (e.g. a verbosity=trace diagnostic, #701)
    # measures that branch's code, so its score and survivors must not land in main's history
    # or rewrite the kind:mutation-survives issue.
    if: always() && needs.stryker.outputs.score != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the score-history chart to gh-pages
      issues: write     # keep the single kind:mutation-survives issue current
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download score and survivor summary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stryker-summary
          path: stryker-summary

      - name: Publish mutation-score history to gh-pages
        # Trend visibility only: the break floor in stryker-config.json is the gate,
        # so the chart never fails the run. No concurrency group: when another gh-pages
        # writer pushes first, the action resets its commit, re-fetches and retries, up to
        # 10 times (writeBenchmarkToGitHubPagesWithRetry in this pinned version). A group
        # would add nothing for that and could get this job cancelled while pending behind
        # a long benchmarks.yaml run.
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
        with:
          name: Mutation score
          tool: 'customBiggerIsBetter'
          output-file-path: stryker-summary/mutation-score.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/stryker
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false

      - name: Update the kind:mutation-survives issue
        # ONE rolling issue, not one per mutant: there are dozens, and per-mutant issues
        # would be noise. Work the list down, then ratchet the break floor up. When a run
        # leaves no gaps, the open issue is closed rather than kept open at zero.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          count=$(grep -c '^- `' stryker-summary/survivors.md || true)
          title="Mutation survivors (${count}) - kill these to raise the score"
          {
            echo "_Updated by the Stryker workflow, [run ${GITHUB_RUN_ID}](${RUN_URL}). The full HTML report is that run's \`stryker-report-${GITHUB_RUN_ID}\` artifact._"
            echo
            cat stryker-summary/survivors.md
          } > issue-body.md
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "kind:mutation-survives" \
            --state open --json number --jq '.[0].number // empty')
          if [ "$count" -eq 0 ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
                --comment "No surviving or uncovered mutants in [run ${GITHUB_RUN_ID}](${RUN_URL}). Closing; a later run that finds one reopens the list as a new issue."
            fi
            exit 0
          fi
          gh label create "kind:mutation-survives" --repo "$GITHUB_REPOSITORY" \
            --color BFD4F2 --description "A mutant survived - a test gap to close" 2>/dev/null || true
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md \
              --label "kind:mutation-survives"
          fi

  # Scheduled runs have no one watching them, so a failure files (or comments on) one tracking
  # issue per workflow instead of failing into a void (#588). A separate job, so only it holds
  # issues: write; manual and push/PR runs are watched by whoever started them.
  notify-failure:
    name: File an issue when the scheduled run fails
    needs: [stryker, publish]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="scheduled-workflow-failure"
          gh label create "$label" --color B60205 \
            --description "A scheduled workflow run failed" 2>/dev/null || true
          title="Scheduled run failed: $WORKFLOW"
          existing="$(gh issue list --label "$label" --state open --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
            echo "Commented on #$existing"
          else
            gh issue create --title "$title" --label "$label" \
              --body "The scheduled run of the \`$WORKFLOW\` workflow failed: $RUN_URL

          Close this issue once the cause is fixed and a run passes."
          fi
