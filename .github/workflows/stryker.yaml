# Stryker mutation testing
#
# Mutation testing is canonical for every repo created from this template.
# The workflow runs Stryker.NET against every test project under tests/ on
# a Windows runner so it can compile every TFM the repo targets - including
# .NET Framework 4.6.2-4.8.1, which a Linux runner cannot build.
#
# Triggers:
# - workflow_dispatch: manual ad-hoc runs (e.g. while iterating on tests)
# - schedule (weekly Sunday 06:00 UTC): catch quality regressions between
#   releases without burning CI time on every PR (mutation testing is slow)
#
# Stryker discovers each test project's mutation targets via the standard
# project-reference graph. Two configuration modes are supported:
# - Root stryker-config.json (umbrella): if present, runs Stryker once with
#   the umbrella config and skips per-project runs (avoids duplicate work).
# - Per-project stryker-config.json (or none): if no root config exists, runs
#   Stryker once per test project; per-project configs override Stryker's
#   defaults when present.
#
# After every run (#300) the `publish` job charts the mutation score on gh-pages
# under /dev/stryker (the same action as the /dev/bench benchmark charts) and keeps
# ONE rolling `kind:mutation-survives` issue listing the surviving and uncovered
# mutants. It is a separate ubuntu job so the long Stryker job, which builds and
# runs the repository's code, never holds a write token.
name: Stryker (mutation testing)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0' # weekly Sunday 06:00 UTC

permissions:
  contents: read

jobs:
  stryker:
    name: Run Stryker
    # Windows runner so Stryker can compile every TFM the repo targets,
    # including .NET Framework 4.6.2-4.8.1. Linux runners cannot build
    # net4x, so they would silently mutate only the non-Framework TFMs
    # and miss bugs that only reproduce on Framework.
    runs-on: windows-latest
    # Skip on the template repo itself - it has no test projects, so the
    # workflow would just no-op every Sunday at 06:00 UTC, wasting a
    # Windows runner allocation. Matches the same-pattern guard used by
    # the .NET test-stage jobs in pr.yaml.
    if: github.repository != 'Chris-Wolfgang/repo-template'
    timeout-minutes: 120
    outputs:
      score: ${{ steps.score.outputs.score }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        # Install every SDK in the canonical test matrix (.NET Core 3.1
        # through .NET 10.0). Stryker has to be able to build whichever
        # TFM each test project targets; pinning to a subset would
        # silently fail repos that target older runtimes.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      # Pinned, not floating (#517).
      - name: Install dotnet-stryker
        shell: pwsh
        env:
          STRYKER_VERSION: '5.0.0'
        run: |
          dotnet tool update -g dotnet-stryker --version $env:STRYKER_VERSION
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install -g dotnet-stryker --version $env:STRYKER_VERSION
          }

      - name: Run Stryker
        shell: pwsh
        run: |
          # Configuration mode resolution:
          #   1. If a root stryker-config.json exists, it is the umbrella -
          #      run Stryker once with it and stop (per-project runs would
          #      duplicate the same work the umbrella already covers).
          #   2. Otherwise, run Stryker against every test project under
          #      tests/. A per-project stryker-config.json next to a test
          #      project overrides Stryker's defaults when present.

          #
          # A zero exit code is not proof that Stryker measured anything. With a
          # break threshold of 0 it exits 0 even after "Compilation failed" aborts
          # the run before a single mutant is tested: score 0.00 %, no report, and
          # a green job. So every run must also leave a JSON report holding at
          # least one tested mutant, or it counts as failed. The reporters are
          # passed on the command line (they override the config's list) so the
          # JSON report exists in both modes.

          $failed = 0
          $reporters = @('--reporter', 'progress', '--reporter', 'html', '--reporter', 'json')

          function Test-StrykerRun([string]$Dir, [datetime]$Since) {
            $reports = @(Get-ChildItem -Path (Join-Path $Dir 'StrykerOutput') -Recurse -Filter 'mutation-report.json' -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -ge $Since })
            if ($reports.Count -eq 0) {
              Write-Host "::error::Stryker in $Dir wrote no mutation-report.json - it stopped before testing any mutant."
              return $false
            }
            $counts = @{}
            foreach ($report in $reports) {
              $json = Get-Content $report.FullName -Raw | ConvertFrom-Json
              foreach ($file in $json.files.PSObject.Properties) {
                foreach ($mutant in $file.Value.mutants) { $counts[$mutant.status] = 1 + [int]$counts[$mutant.status] }
              }
            }
            Write-Host "Mutant statuses in ${Dir}: $(($counts.GetEnumerator() | Sort-Object Name | ForEach-Object { "$($_.Name)=$($_.Value)" }) -join ', ')"
            # Stryker's score: detected (Killed + Timeout) over valid (detected + Survived + NoCoverage).
            $detected = [int]$counts['Killed'] + [int]$counts['Timeout']
            $valid = $detected + [int]$counts['Survived'] + [int]$counts['NoCoverage']
            if ($valid -eq 0) {
              Write-Host "::error::Stryker in $Dir tested no mutants - there is no score to judge."
              return $false
            }
            Write-Host ("Mutation score in {0}: {1:N2} % ({2} of {3} detected)" -f $Dir, (100.0 * $detected / $valid), $detected, $valid)
            return $true
          }

          if (Test-Path 'stryker-config.json') {
            Write-Host "::group::Stryker with root umbrella stryker-config.json"
            # Restore first. Stryker analyses every project BEFORE its own restore,
            # and on a fresh checkout a .NET Framework project analysed unrestored
            # comes back without its package references, so its mutated compile
            # fails ("System.Data.Entity does not exist") and the run aborts.
            $solution = (Get-Content 'stryker-config.json' -Raw | ConvertFrom-Json).'stryker-config'.solution
            if ($solution) { dotnet restore $solution } else { dotnet restore }
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::dotnet restore failed"; exit 1 }
            $started = Get-Date
            dotnet stryker --config-file stryker-config.json @reporters
            if ($LASTEXITCODE -ne 0) { $failed++ }
            elseif (-not (Test-StrykerRun -Dir (Get-Location).Path -Since $started)) { $failed++ }
            Write-Host "::endgroup::"
          }
          else {
            $tests = @(Get-ChildItem -Path tests -Recurse -Filter '*Test*.csproj' -ErrorAction SilentlyContinue)

            if ($tests.Count -eq 0) {
              Write-Host "::notice::No test projects found under tests/ - skipping Stryker run."
              exit 0
            }

            Write-Host "Found $($tests.Count) test project(s):"
            $tests | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host ""

            foreach ($proj in $tests) {
              $dir = $proj.DirectoryName
              Write-Host "::group::Stryker in $dir"
              Push-Location $dir
              try {
                # Restore before Stryker analyses the project; see the umbrella branch.
                dotnet restore
                if ($LASTEXITCODE -ne 0) { $failed++ }
                else {
                  $started = Get-Date
                  dotnet stryker @reporters
                  if ($LASTEXITCODE -ne 0) { $failed++ }
                  elseif (-not (Test-StrykerRun -Dir $dir -Since $started)) { $failed++ }
                }
              } finally {
                Pop-Location
              }
              Write-Host "::endgroup::"
            }
          }

          if ($failed -gt 0) {
            Write-Host "::error::$failed Stryker run(s) failed"
            exit 1
          }

      - name: Summarize mutation score and survivors
        id: score
        # always(): a run that fell below the break floor is exactly when the trend and
        # the survivor list matter most. Reads the same JSON reports Test-StrykerRun checks.
        if: always()
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path . -Recurse -Filter 'mutation-report.json' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]StrykerOutput[\\/]' })
          if ($reports.Count -eq 0) {
            Write-Host "::warning::No mutation-report.json - there is no score to publish."
            exit 0
          }

          $counts = @{}
          $gaps = [System.Collections.Generic.List[object]]::new()
          foreach ($report in $reports) {
            $json = Get-Content $report.FullName -Raw | ConvertFrom-Json
            foreach ($file in $json.files.PSObject.Properties) {
              # Keys are absolute and can climb through a linked project
              # (src\X-EF10\..\X\File.cs); report them relative to the repository.
              $path = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, [IO.Path]::GetFullPath($file.Name)) -replace '\\', '/'
              foreach ($mutant in $file.Value.mutants) {
                $counts[$mutant.status] = 1 + [int]$counts[$mutant.status]
                if ($mutant.status -in 'Survived', 'NoCoverage') {
                  $gaps.Add([pscustomobject]@{ Path = $path; Line = [int]$mutant.location.start.line; Status = $mutant.status; Mutator = $mutant.mutatorName })
                }
              }
            }
          }

          # Stryker's score: detected (Killed + Timeout) over valid (detected + Survived + NoCoverage).
          $detected = [int]$counts['Killed'] + [int]$counts['Timeout']
          $valid = $detected + [int]$counts['Survived'] + [int]$counts['NoCoverage']
          if ($valid -eq 0) {
            Write-Host "::warning::The reports hold no tested mutant - there is no score to publish."
            exit 0
          }
          $score = [math]::Round(100.0 * $detected / $valid, 2)

          # A source file linked into several projects (-Core into -Core-EF6..EF10) is
          # mutated once per project; list each gap once.
          $lines = @($gaps |
            Sort-Object Path, Line, Status, Mutator -Unique |
            ForEach-Object { "- ``$($_.Path):$($_.Line)`` - $($_.Status): $($_.Mutator)" })
          $config = Get-Content 'stryker-config.json' -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          $break = if ($config) { $config.'stryker-config'.thresholds.break } else { $null }
          $floor = if ($null -ne $break) { "$break %" } else { 'none' }

          New-Item -ItemType Directory -Force -Path stryker-summary | Out-Null
          ConvertTo-Json -InputObject @(@{ name = 'Mutation score'; unit = '%'; value = $score }) |
            Set-Content stryker-summary/mutation-score.json
          $header = @(
            ("Mutation score **{0} %** (break floor: {1}) over {2} valid mutants: {3} killed, {4} timed out, {5} survived, {6} not covered." -f
              $score, $floor, $valid, [int]$counts['Killed'], [int]$counts['Timeout'], [int]$counts['Survived'], [int]$counts['NoCoverage'])
            ''
            "$($lines.Count) surviving or uncovered mutants (unique by file, line and mutator). Kill these to raise the score:"
            ''
          )
          $header + $lines | Set-Content stryker-summary/survivors.md

          Get-Content stryker-summary/survivors.md | Add-Content $env:GITHUB_STEP_SUMMARY
          "score=$score" | Add-Content $env:GITHUB_OUTPUT

      - name: Upload score and survivor summary
        if: always() && steps.score.outputs.score != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-summary
          path: stryker-summary/
          retention-days: 30

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-report-${{ github.run_id }}
          path: |
            **/StrykerOutput/**
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Publish score history and survivors
    needs: stryker
    # Runs after a failed gate too: the score and the survivors are the point then.
    if: always() && needs.stryker.outputs.score != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the score-history chart to gh-pages
      issues: write     # keep the single kind:mutation-survives issue current
    # Same group as benchmarks.yaml, so two gh-pages writers never race a push.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download score and survivor summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stryker-summary
          path: stryker-summary

      - name: Publish mutation-score history to gh-pages
        # Trend visibility only: the break floor in stryker-config.json is the gate,
        # so the chart never fails the run.
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
        with:
          name: Mutation score
          tool: 'customBiggerIsBetter'
          output-file-path: stryker-summary/mutation-score.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/stryker
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false

      - name: Update the kind:mutation-survives issue
        # ONE rolling issue, not one per mutant: there are over a hundred, and per-mutant
        # issues would be noise. Work the list down, then ratchet the break floor up.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          count=$(grep -c '^- `' stryker-summary/survivors.md || true)
          title="Mutation survivors (${count}) - kill these to raise the score"
          {
            echo "_Updated by the Stryker workflow, [run ${GITHUB_RUN_ID}](${RUN_URL}). The full HTML report is that run's \`stryker-report-${GITHUB_RUN_ID}\` artifact._"
            echo
            cat stryker-summary/survivors.md
          } > issue-body.md
          gh label create "kind:mutation-survives" --repo "$GITHUB_REPOSITORY" \
            --color BFD4F2 --description "A mutant survived - a test gap to close" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "kind:mutation-survives" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md \
              --label "kind:mutation-survives"
          fi
