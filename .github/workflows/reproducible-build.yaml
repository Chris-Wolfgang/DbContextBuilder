name: Build reproducibility

# Verifies that the deterministic-build knobs in Directory.Build.props
# (<Deterministic>, <ContinuousIntegrationBuild>, SourceLink + EmbedUntrackedSources)
# actually produce byte-identical managed assemblies when the same commit is
# built on different runners. Advisory — cross-OS differences are reported as a
# warning, not a hard failure (managed IL is expected to match; native/embedded
# differences, if any, surface here for investigation).
#
# Covers one representative project per shared-source group rather than all 10
# src projects: -Core-EF6/7/8/9/10 compile the same source files, linked from
# src/Wolfgang.DbContextBuilder-Core/ by each wrapper's own csproj (see
# docs/adr/0001), so only -Core-EF10 (net10.0, the newest shipped package) and
# -Core-EF8 (net8.0) are built — the other EF-pinned wrappers would just re-verify
# the same source under a different TFM. -Core itself no longer ships (ADR-0003).

on:
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * 1'   # Mondays 05:40 UTC

permissions:
  contents: read

jobs:
  build:
    name: Build + hash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build src (Release, deterministic)
        shell: bash
        run: |
          dotnet build src/Wolfgang.DbContextBuilder-Core-EF10/Wolfgang.DbContextBuilder-Core-EF10.csproj \
            -c Release -f net10.0 -p:ContinuousIntegrationBuild=true
          dotnet build src/Wolfgang.DbContextBuilder-Core-EF8/Wolfgang.DbContextBuilder-Core-EF8.csproj \
            -c Release -f net8.0 -p:ContinuousIntegrationBuild=true
          dotnet build src/Wolfgang.DbContextBuilder.Abstractions/Wolfgang.DbContextBuilder.Abstractions.csproj \
            -c Release -f netstandard2.0 -p:ContinuousIntegrationBuild=true

      - name: Hash assemblies
        shell: bash
        run: |
          sha256sum \
            src/Wolfgang.DbContextBuilder-Core-EF10/bin/Release/net10.0/Wolfgang.DbContextBuilder-Core-EF10.dll \
            src/Wolfgang.DbContextBuilder-Core-EF8/bin/Release/net8.0/Wolfgang.DbContextBuilder-Core-EF8.dll \
            src/Wolfgang.DbContextBuilder.Abstractions/bin/Release/netstandard2.0/Wolfgang.DbContextBuilder.Abstractions.dll \
            | awk '{ n = split($2, parts, "/"); print $1 "  " parts[n] }' \
            | sort > "hashes-${{ matrix.os }}.txt"
          echo "== ${{ matrix.os }} =="
          cat "hashes-${{ matrix.os }}.txt"

      - name: Upload hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hashes-${{ matrix.os }}
          path: hashes-${{ matrix.os }}.txt

  compare:
    name: Compare across runners
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download hashes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: hashes

      - name: Diff manifests
        shell: bash
        run: |
          ubuntu="hashes/hashes-ubuntu-latest/hashes-ubuntu-latest.txt"
          windows="hashes/hashes-windows-latest/hashes-windows-latest.txt"
          echo "== ubuntu-latest =="; cat "$ubuntu"
          echo "== windows-latest =="; cat "$windows"
          if diff -u "$ubuntu" "$windows"; then
            echo "✅ Reproducible: managed assembly hashes match across ubuntu + windows."
          else
            echo "::warning::Assembly hashes differ across runners — the build is not byte-identical cross-OS. Investigate embedded paths / SourceLink normalization."
          fi

  # Scheduled runs have no one watching them, so a failure files (or comments on) one tracking
  # issue per workflow instead of failing into a void (#588). A separate job, so only it holds
  # issues: write; manual and push/PR runs are watched by whoever started them.
  notify-failure:
    name: File an issue when the scheduled run fails
    needs: [build, compare]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="scheduled-workflow-failure"
          gh label create "$label" --color B60205 \
            --description "A scheduled workflow run failed" 2>/dev/null || true
          title="Scheduled run failed: $WORKFLOW"
          existing="$(gh issue list --label "$label" --state open --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
            echo "Commented on #$existing"
          else
            gh issue create --title "$title" --label "$label" \
              --body "The scheduled run of the \`$WORKFLOW\` workflow failed: $RUN_URL

          Close this issue once the cause is fixed and a run passes."
          fi
